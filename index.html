    <script>
        const daysMalayalam = ["ഞായർ", "തിങ്കൾ", "ചൊവ്വ", "ബുധൻ", "വ്യാഴം", "വെള്ളി", "ശനി"];
        const sunriseOffsets = [40, 35, 25, 10, 5, 5, 10, 15, 15, 15, 20, 35];
        const timingsMap = [[10.5, 9.0, 3.5, 6.0], [1.5, 7.5, 10.0, 12.0], [9.0, 6.0, 1.5, 4.0], [6.0, 4.5, 8.0, 10.0], [7.5, 3.0, 4.0, 6.0], [4.5, 1.5, 11.0, 13.0], [3.0, 0.0, 2.5, 5.0]];
        const sankrantiData = [{cutoff: 14, name: "ധനു", next: "മകരം", offset: 17}, {cutoff: 13, name: "മകരം", next: "കുംഭം", offset: 0}, {cutoff: 14, name: "കുംഭം", next: "മീനം", offset: 0}, {cutoff: 14, name: "മീനം", next: "മേടം", offset: 0}, {cutoff: 15, name: "മേടം", next: "ഇടവം", offset: 0}, {cutoff: 15, name: "ഇടവം", next: "മിഥുനം", offset: 0}, {cutoff: 16, name: "മിഥുനം", next: "കർക്കടകം", offset: 0}, {cutoff: 17, name: "കർക്കടകം", next: "ചിങ്ങം", offset: 0}, {cutoff: 17, name: "ചിങ്ങം", next: "കന്നി", offset: 0}, {cutoff: 17, name: "കന്നി", next: "തുലാം", offset: 0}, {cutoff: 16, name: "തുലാം", next: "വൃശ്ചികം", offset: 0}, {cutoff: 16, name: "വൃശ്ചികം", next: "ധനു", offset: 0}];

        function formatTime(d) { let h=Math.floor(d), m=Math.floor((d-h)*60), p="AM"; if(h>=12){p="PM";if(h>12)h-=12;} if(h===0)h=12; return `${h}:${m<10?"0"+m:m} ${p}`; }
        function calculateTime(b,o) { return ((b*60)+o)/60; }

        function setPanchangam() {
            const date = new Date();
            const d = date.getDate(), m = date.getMonth(), y = date.getFullYear(), dayIndex = date.getDay();
            
            const malRule = sankrantiData[m];
            let malDateString = (d < malRule.cutoff) ? `${malRule.name} ${malRule.offset + d}` : `${malRule.next} ${d - malRule.cutoff + 1}`;
            if(m===0 && d < 14) malDateString = `ധനു ${16+d}`; 
            
            // Date Setup
            document.getElementById("m-date-main").innerText = malDateString;
            document.getElementById("e-date-sub").innerText = `${daysMalayalam[dayIndex]}, ${d}/${m+1}/${y}`;

            const offset = sunriseOffsets[m];
            const r = timingsMap[dayIndex];
            document.getElementById("t-rahu").innerText = `${formatTime(calculateTime(6.0+r[0], offset))} - ${formatTime(calculateTime(6.0+r[0], offset)+1.5)}`;
            document.getElementById("t-nalla").innerText = `${formatTime(calculateTime(6.0+r[2], offset))} - ${formatTime(calculateTime(6.0+r[3], offset))}`;
        }

        setPanchangam();
    </script>
