        <div id="eventListBox" class="event-list-box" style="display:none;">

        </div>

        <div class="about-card" style="margin-top: 20px; text-align: center;">

            <button class="book-btn" onclick="contactWhatsApp('നമസ്കാരം, വിശേഷ ദിവസത്തെ പൂജ ബുക്ക് ചെയ്യാൻ ആഗ്രഹിക്കുന്നു')">പൂജ ബുക്ക് ചെയ്യാൻ</button>
        </div>
    </main>

            <span class="icon">👨‍🎓</span><span class="label">Gurus</span>

            <span class="icon">📅</span><span class="label">Calendar</span>

        <a href="rates.html" class="nav-item">
            <span class="icon">₹</span><span class="label">Rates</span>

        <a href="about.html" class="nav-item">
            <span class="icon">ℹ️</span><span class="label">About</span>
        </a>

    <script src="script.js"></script>

    <script>
        let currentYear = 2026; 
        let currentMonth = new Date().getFullYear() === 2026 ? new Date().getMonth() : 0; 

        // --- HINDU VEDIC CALENDAR DATA 2026 ---
        const festivalData = {
            "2026": {
                // JANUARY (Dhanu - Makaram)
                "0-2": "മന്നം ജയന്തി",
                "0-14": "മകര സംക്രാന്തി (Makara Sankranti)",
                "0-26": "റിപ്പബ്ലിക് ദിനം",

                // FEBRUARY (Makaram - Kumbham)
                "1-1": "തൈപ്പൂയം (Thaipooyam)",
                "1-16": "മഹാ ശിവരാത്രി (Maha Shivaratri)",
                "1-24": "ആറ്റുകാൽ പൊങ്കാല (Attukal Pongala)", 

                // APRIL (Meenum - Medam)
                "3-14": "വിഷു (Vishu)",
                "3-28": "തൃശ്ശൂർ പൂരം (Thrissur Pooram)",

                // MAY (Medam - Edavam)
                "4-1": "മെയ് ദിനം",
                "4-21": "ശങ്കരാചാര്യ ജയന്തി",
                
                // JUNE (Edavam - Mithunam)
                "5-21": "ലോക യോഗ ദിനം",

                // JULY (Mithunam - Karkidakam)
                "6-17": "രാമായണ മാസാചരണം (Ramayana Masam)",
                
                // AUGUST (Karkidakam - Chingam)
                "7-15": "സ്വാതന്ത്ര്യ ദിനം",
                "7-16": "ചിങ്ങം 1 (Karshaka Dinam)",
                "7-25": "ഉത്രാടം (First Onam)",
                "7-26": "തിരുവോണം (Thiruvonam)",
                "7-27": "അവിട്ടം (Third Onam)",
                "7-28": "ചതയം (Fourth Onam)",
                "7-28": "അയ്യങ്കാളി ജയന്തി",
                "7-30": "ശ്രീനാരായണ ഗുരു ജയന്തി",

                // SEPTEMBER (Chingam - Kanni)
                "8-4": "ശ്രീകൃഷ്ണ ജയന്തി (Ashtami Rohini)",
                "8-16": "വിശ്വകർമ്മ ദിനം",
                "8-21": "ശ്രീനാരായണ ഗുരു സമാധി",

                // OCTOBER (Kanni - Thulam)
                "9-2": "ഗാന്ധി ജയന്തി",
                "9-12": "നവരാത്രി തുടക്കം",
                "9-18": "ദുർഗ്ഗാഷ്ടമി (Durgashtami)",
                "9-19": "മഹാനവമി (Mahanavami)",
                "9-20": "വിജയദശമി (Vidyarambham)",

                // NOVEMBER (Thulam - Vrischikam)
                "10-1": "കേരളപ്പിറവി",
                "10-8": "ദീപാവലി (Deepavali)",
                "10-17": "മണ്ഡലകാലം തുടക്കം (Mandala Kalam Starts)",
                "10-24": "തൃക്കാർത്തിക (Thrikkarthika)",

                // DECEMBER (Vrischikam - Dhanu)
                "11-20": "കുചേല ദിനം",
                "11-21": "ഗുരുവായൂർ ഏകാദശി (Guruvayur Ekadashi)", 
                "11-26": "മണ്ഡല പൂജ (Mandala Pooja)"
            }
        };

        const malayalamMonths = ["ജനുവരി", "ഫെബ്രുവരി", "മാർച്ച്", "ഏപ്രിൽ", "മെയ്", "ജൂൺ", "ജൂലൈ", "ഓഗസ്റ്റ്", "സെപ്റ്റംബർ", "ഒക്ടോബർ", "നവംബർ", "ഡിസംബർ"];
        const weekDays = ["ഞായർ", "തിങ്കൾ", "ചൊവ്വ", "ബുധൻ", "വ്യാഴം", "വെള്ളി", "ശനി"];
        
        const sankrantiData = [
            { cutoff: 14, before: "ധനു", after: "മകരം", offsetBefore: 17, offsetAfter: 1 },    
            { cutoff: 13, before: "മകരം", after: "കുംഭം", offsetBefore: 0, offsetAfter: 1 },    
            { cutoff: 14, before: "കുംഭം", after: "മീനം", offsetBefore: 0, offsetAfter: 1 },    
            { cutoff: 14, before: "മീനം", after: "മേടം", offsetBefore: 0, offsetAfter: 1 },     
            { cutoff: 15, before: "മേടം", after: "ഇടവം", offsetBefore: 0, offsetAfter: 1 },     
            { cutoff: 15, before: "ഇടവം", after: "മിഥുനം", offsetBefore: 0, offsetAfter: 1 },   
            { cutoff: 16, before: "മിഥുനം", after: "കർക്കടകം", offsetBefore: 0, offsetAfter: 1 }, 
            { cutoff: 17, before: "കർക്കടകം", after: "ചിങ്ങം", offsetBefore: 0, offsetAfter: 1 }, 
            { cutoff: 17, before: "ചിങ്ങം", after: "കന്നി", offsetBefore: 0, offsetAfter: 1 },    
            { cutoff: 17, before: "കന്നി", after: "തുലാം", offsetBefore: 0, offsetAfter: 1 },     
            { cutoff: 16, before: "തുലാം", after: "വൃശ്ചികം", offsetBefore: 0, offsetAfter: 1 },  
            { cutoff: 16, before: "വൃശ്ചികം", after: "ധനു", offsetBefore: 0, offsetAfter: 1 }     
        ];

        function getMalayalamDate(engDate, monthIndex) {
            const rule = sankrantiData[monthIndex];
            if (engDate < rule.cutoff) {
                let malDate = rule.offsetBefore + engDate;
                if(monthIndex === 0) malDate = 16 + engDate; 
                return `${rule.before} ${malDate}`;
            } else {
                let malDate = engDate - rule.cutoff + 1;
                return `${rule.after} ${malDate}`;
            }
        }

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            const display = document.getElementById('monthDisplay');
            const eraDisplay = document.getElementById('eraDisplay');
            const eventBox = document.getElementById('eventListBox');
            const eventContent = document.getElementById('eventListContent');
            
            grid.innerHTML = "";
            eventContent.innerHTML = ""; 
            let hasEvents = false;

            display.innerText = `${malayalamMonths[currentMonth]} ${currentYear}`;
            const rule = sankrantiData[currentMonth];
            eraDisplay.innerText = `${rule.before} - ${rule.after}`;

            weekDays.forEach(day => {
                const div = document.createElement('div');
                div.className = 'day-name';
                div.innerText = day;
                grid.appendChild(div);
            });

            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                grid.appendChild(document.createElement('div'));
            }

            for (let d = 1; d <= daysInMonth; d++) {
                const dateDiv = document.createElement('div');
                dateDiv.className = 'calendar-date';
                
                const engSpan = document.createElement('span');
                engSpan.className = 'eng-date';
                engSpan.innerText = d;

                const malSpan = document.createElement('span');
                malSpan.className = 'mal-date';
                malSpan.innerText = getMalayalamDate(d, currentMonth);

                dateDiv.appendChild(engSpan);
                dateDiv.appendChild(malSpan);

                const dateKey = `${currentMonth}-${d}`;
                const yearData = festivalData[currentYear];
                
                if (yearData && yearData[dateKey]) {
                    const dot = document.createElement('div');
                    dot.className = 'event-indicator';
                    dateDiv.appendChild(dot);
                    dateDiv.style.borderColor = "#d32f2f"; 
                    dateDiv.style.backgroundColor = "#fff0f0";

                    hasEvents = true;
                    const eventItem = document.createElement('div');
                    eventItem.className = 'event-item';
                    eventItem.innerHTML = `
                        <div class="event-date-badge">${d}</div>
                        <div class="event-name">${yearData[dateKey]}</div>
                    `;
                    eventContent.appendChild(eventItem);
                }

                const checkDay = new Date(currentYear, currentMonth, d).getDay();
                if (checkDay === 0) dateDiv.classList.add('sunday');

                const today = new Date();
                if (d === today.getDate() && currentMonth === today.getMonth() && currentYear === today.getFullYear()) {
                    dateDiv.classList.add('today');
                }

                grid.appendChild(dateDiv);
            }

            if(hasEvents) {
                eventBox.style.display = 'block';
            } else {
                eventBox.style.display = 'none';
            }
        }

        function changeMonth(step) {
            currentMonth += step;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; } 
            else if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar();
        }

        renderCalendar();
    </script>
</body>
</html>
