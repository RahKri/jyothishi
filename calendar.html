    <script src="script.js"></script>

    <script>
        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth();

        const malayalamMonths = ["ജനുവരി", "ഫെബ്രുവരി", "മാർച്ച്", "ഏപ്രിൽ", "മെയ്", "ജൂൺ", "ജൂലൈ", "ഓഗസ്റ്റ്", "സെപ്റ്റംബർ", "ഒക്ടോബർ", "നവംബർ", "ഡിസംബർ"];
        const weekDays = ["ഞായർ", "തിങ്കൾ", "ചൊവ്വ", "ബുധൻ", "വ്യാഴം", "വെള്ളി", "ശനി"];

        // Data for Solar Month Transitions (Approximate for 2025/2026)
        // Format: [Cutoff Date, Month Name Before Cutoff, Month Name After Cutoff, Days Offset]
        const sankrantiData = [
            { cutoff: 14, before: "ധനു", after: "മകരം", offsetBefore: 17, offsetAfter: 1 },    // Jan
            { cutoff: 13, before: "മകരം", after: "കുംഭം", offsetBefore: 0, offsetAfter: 1 },    // Feb
            { cutoff: 14, before: "കുംഭം", after: "മീനം", offsetBefore: 0, offsetAfter: 1 },    // Mar
            { cutoff: 14, before: "മീനം", after: "മേടം", offsetBefore: 0, offsetAfter: 1 },     // Apr (Vishu)
            { cutoff: 15, before: "മേടം", after: "ഇടവം", offsetBefore: 0, offsetAfter: 1 },     // May
            { cutoff: 15, before: "ഇടവം", after: "മിഥുനം", offsetBefore: 0, offsetAfter: 1 },   // Jun
            { cutoff: 16, before: "മിഥുനം", after: "കർക്കടകം", offsetBefore: 0, offsetAfter: 1 }, // Jul
            { cutoff: 17, before: "കർക്കടകം", after: "ചിങ്ങം", offsetBefore: 0, offsetAfter: 1 }, // Aug (New Year)
            { cutoff: 17, before: "ചിങ്ങം", after: "കന്നി", offsetBefore: 0, offsetAfter: 1 },    // Sep
            { cutoff: 17, before: "കന്നി", after: "തുലാം", offsetBefore: 0, offsetAfter: 1 },     // Oct
            { cutoff: 16, before: "തുലാം", after: "വൃശ്ചികം", offsetBefore: 0, offsetAfter: 1 },  // Nov
            { cutoff: 16, before: "വൃശ്ചികം", after: "ധനു", offsetBefore: 0, offsetAfter: 1 }     // Dec
        ];

        function getMalayalamDate(engDate, monthIndex) {
            const rule = sankrantiData[monthIndex];
            
            // Before the Sankranti date (Cutoff)
            if (engDate < rule.cutoff) {
                // Calculate remaining days of previous Malayalam month
                // This is an approximation. A real Panchangam needs complex math.
                // We use a simplified offset logic here for display purposes.
                let malDate = rule.offsetBefore + engDate;
                if(monthIndex === 0) malDate = 16 + engDate; // Specific fix for Dhanu in Jan
                return `${rule.before} ${malDate}`;
            } 
            // After the Sankranti date
            else {
                let malDate = engDate - rule.cutoff + 1;
                return `${rule.after} ${malDate}`;
            }
        }

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            const display = document.getElementById('monthDisplay');
            const eraDisplay = document.getElementById('eraDisplay');
            
            grid.innerHTML = "";
            display.innerText = `${malayalamMonths[currentMonth]} ${currentYear}`;
            
            // Show the Era range (e.g. Makaram - Kumbham)
            const rule = sankrantiData[currentMonth];
            eraDisplay.innerText = `${rule.before} - ${rule.after}`;

            // Weekday Headers
            weekDays.forEach(day => {
                const div = document.createElement('div');
                div.className = 'day-name';
                div.innerText = day;
                grid.appendChild(div);
            });

            // Date Calculations
            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

            // Empty Slots
            for (let i = 0; i < firstDay; i++) {
                grid.appendChild(document.createElement('div'));
            }

            // Fill Dates
            for (let d = 1; d <= daysInMonth; d++) {
                const dateDiv = document.createElement('div');
                dateDiv.className = 'calendar-date';
                
                // 1. English Date Number
                const engSpan = document.createElement('span');
                engSpan.className = 'eng-date';
                engSpan.innerText = d;

                // 2. Malayalam Date Logic
                const malSpan = document.createElement('span');
                malSpan.className = 'mal-date';
                malSpan.innerText = getMalayalamDate(d, currentMonth);

                dateDiv.appendChild(engSpan);
                dateDiv.appendChild(malSpan);

                // Highlight Sunday
                const checkDay = new Date(currentYear, currentMonth, d).getDay();
                if (checkDay === 0) dateDiv.classList.add('sunday');

                // Highlight Today
                const today = new Date();
                if (d === today.getDate() && currentMonth === today.getMonth() && currentYear === today.getFullYear()) {
                    dateDiv.classList.add('today');
                }

                grid.appendChild(dateDiv);
            }
        }

        function changeMonth(step) {
            currentMonth += step;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; } 
            else if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar();
        }

        renderCalendar();
    </script>
</body>
